name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests never launch Electron; skip the ~100MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # server tests need node:sqlite (>=22.13)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
